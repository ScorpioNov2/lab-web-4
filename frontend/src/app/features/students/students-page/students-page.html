<section class="toolbar-section">
	<div class="search-box">
		<input
			type="text"
			placeholder="Поиск..."
			aria-label="Поиск"
			[value]="criteria().searchKeyword"
			(input)="onSearch($event)"
		/>
	</div>
	<div class="action-buttons">
		<button type="button" class="btn btn-success" (click)="openAdd()">Добавление</button>
		<button
			type="button"
			class="btn btn-primary"
			[disabled]="focusedIsuId() === null"
			(click)="editSelected()"
		>
			Редактирование
		</button>
		<button
			type="button"
			class="btn btn-danger"
			[disabled]="focusedIsuId() === null"
			(click)="deleteSelected()"
		>
			Удаление
		</button>
	</div>
</section>

<section class="status-section">
	<span class="badge-info">Всего: {{ totalStudents() }} студентов</span>
</section>

<section #tableContainer class="table-container" [class.is-loading]="loading.isLoading()">
	<app-loading-overlay />
	@if (students().length === 0) {
		<div class="empty-state">
			<img src="assets/app/empty-box.png" alt="No data" class="empty-img" />
			<p class="empty-text">
				{{
					result() === null
						? 'Здесь пока ничего нет!'
						: 'Список пуст или результаты не найдены.'
				}}
			</p>
			@if (!auth.isLoggedIn()) {
				<div class="empty-text-wrapper">
					Вы можете
					<button
						type="button"
						class="btn btn-secondary btn-empty-login"
						(click)="authModal.open('login'); $event.stopPropagation()"
					>
						Войти</button
					>, чтобы просмотреть данные.
				</div>
			}
		</div>
	} @else {
		<app-student-table
			[students]="students()"
			[sortField]="criteria().sortField"
			[sortDirection]="criteria().sortDirection"
			[focusedIsuId]="focusedIsuId()"
			(sort)="onSort($event)"
			(rowSelect)="focusedIsuId.set($event)"
			(rowOpen)="openDetails($event)"
		/>
	}
</section>

<app-pagination
	[currentPage]="criteria().pageNumber"
	[totalPages]="totalPages()"
	(pageChange)="onPageChange($event)"
/>

@if (modal(); as state) {
	<app-student-modal
		[state]="state"
		(closed)="closeModal()"
		(save)="saveStudent($event)"
		(remove)="deleteStudent($event)"
		(switchToEdit)="openEdit($event)"
		(cancelEdit)="backToView($event)"
	/>
}
