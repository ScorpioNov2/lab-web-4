@for (flight of flights(); track flight.id) {
	<div
		#flyer
		class="pigeon-flyer"
		[class.is-custom]="flight.useThemeImage"
		[class.is-static]="flight.isStatic"
		[class.is-flying]="flight.flying"
		[style.--pigeon-duration]="flight.seconds + 's'"
		[style.--pigeon-from]="flight.from + 'px'"
		[style.--pigeon-to]="flight.to + 'px'"
		(animationend)="onAnimationEnd($event)"
	>
		<div class="pigeon-flyer-inner">
			<!-- rope + sign (to the left of the bird, the rope runs back to the beak) -->
			<div class="pigeon-tow">
				<div class="pigeon-rope"></div>
				<div class="pigeon-string pigeon-string-left"></div>
				<div class="pigeon-string pigeon-string-right"></div>
				<div class="pigeon-board" role="status">
					Welcome <strong class="pigeon-board-name">{{ flight.name }}</strong> to the
					system
				</div>
			</div>

			<div class="pigeon-bird" aria-hidden="true">
				@if (flight.useThemeImage) {
					<!-- painted by CSS from --welcome-flyer-image -->
					<div class="pigeon-bird-image"></div>
				} @else {
					<svg
						viewBox="0 0 112 84"
						width="112"
						height="84"
						focusable="false"
						style="overflow: visible"
					>
						<defs>
							<linearGradient id="pigeon-neck" x1="0" y1="0" x2="1" y2="1">
								<stop offset="0" stop-color="#3fb68b" />
								<stop offset=".55" stop-color="#7a5fc4" />
								<stop offset="1" stop-color="#b24fa8" />
							</linearGradient>
							<linearGradient id="pigeon-belly" x1="0" y1="0" x2="0" y2="1">
								<stop offset="0" stop-color="#a3aec1" />
								<stop offset="1" stop-color="#c9d1de" />
							</linearGradient>
							<clipPath id="pigeon-wing-clip">
								<path
									d="M68,39 C64,28 52,14 36,4 L33,5 L36,9 L31,10 L35,14 L30,16 L35,20 L31,23 L38,26 L36,29 L45,33 C50,38 52,43 54,46 C60,48 66,45 68,39 Z"
								/>
							</clipPath>
						</defs>
						<g class="pigeon-wing-far">
							<path
								d="M68,39 C64,28 52,14 36,4 L33,5 L36,9 L31,10 L35,14 L30,16 L35,20 L31,23 L38,26 L36,29 L45,33 C50,38 52,43 54,46 C60,48 66,45 68,39 Z"
								fill="#6d7990"
								transform="translate(-6 2)"
							/>
						</g>
						<path d="M30,42 L5,37 L2,47 L6,56 L30,52 Z" fill="#6f7c93" />
						<path d="M11,38 L5,37 L2,47 L6,56 L12,54 Q8,46 11,38 Z" fill="#3d4658" />
						<path
							d="M28,44 C28,34 44,30 60,32 C72,33 80,36 86,40 C90,44 86,52 76,54 C62,58 40,58 32,52 C29,50 28,47 28,44 Z"
							fill="#98a4b8"
						/>
						<path
							d="M34,50 C44,56 62,57 76,53 C70,57 48,60 34,52 Z"
							fill="url(#pigeon-belly)"
						/>
						<path
							d="M62,57 L55,62 M69,56 L63,62"
							stroke="#c97b84"
							stroke-width="1.7"
							stroke-linecap="round"
						/>
						<ellipse
							cx="82"
							cy="40"
							rx="9"
							ry="7"
							transform="rotate(25 82 40)"
							fill="url(#pigeon-neck)"
						/>
						<circle cx="90" cy="32.5" r="8.5" fill="#7f8ca3" />
						<path d="M97,31 L108,33.8 L97,36.4 Z" fill="#d8c8ae" />
						<path d="M104,33.2 L108,33.8 L104,34.6 Z" fill="#5a4a3a" />
						<circle cx="97.2" cy="32" r="1.9" fill="#f6f6f6" />
						<circle cx="92.5" cy="30.5" r="2.1" fill="#e8742a" />
						<circle cx="92.8" cy="30.5" r="1" fill="#111" />
						<circle cx="93.2" cy="30" r=".4" fill="#fff" />
						<g class="pigeon-wing-near">
							<path
								d="M68,39 C64,28 52,14 36,4 L33,5 L36,9 L31,10 L35,14 L30,16 L35,20 L31,23 L38,26 L36,29 L45,33 C50,38 52,43 54,46 C60,48 66,45 68,39 Z"
								fill="#aab5c8"
							/>
							<g
								clip-path="url(#pigeon-wing-clip)"
								stroke="#39435a"
								stroke-width="3.4"
							>
								<path d="M36.7,32.7 L59.9,17.1" />
								<path d="M31.5,25.1 L54.7,9.5" />
							</g>
							<path
								d="M68,39 C64,28 52,14 36,4 L33,5 L36,9 L31,10 L35,14 L30,16 L35,20 L31,23 L38,26 L36,29 L45,33 C50,38 52,43 54,46 C60,48 66,45 68,39 Z"
								fill="none"
								stroke="#7e8aa1"
								stroke-width=".8"
								stroke-linejoin="round"
							/>
						</g>
					</svg>
				}
			</div>
		</div>
	</div>
}
